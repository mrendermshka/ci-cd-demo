name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Р—Р°РІР°РЅС‚Р°Р¶РёС‚Рё РєРѕРґ
        uses: actions/checkout@v5

      - name: Р’СЃС‚Р°РЅРѕРІРёС‚Рё Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Р’СЃС‚Р°РЅРѕРІРёС‚Рё Р·Р°Р»РµР¶РЅРѕСЃС‚С–
        run: npm ci

      - name: РџРµСЂРµРІС–СЂРёС‚Рё СЃС‚РёР»СЊ РєРѕРґСѓ
        run: npm run lint

      - name: Р—Р°РїСѓСЃС‚РёС‚Рё С‚РµСЃС‚Рё
        run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
